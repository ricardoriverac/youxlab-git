<script src="./audioWave.js"></script>
<script>
  const waveformContainer = document.getElementById('waveform');
  const loadingIndicator = document.getElementById('wave-loading');
  const playBtn = document.getElementById('play');
  const playIcon = document.getElementById('play-icon');

  const wavesurfer = WaveSurfer.create({
    container: waveformContainer,
    waveColor: '#999',
    progressColor: '#2727B2',
    height: 100,
    responsive: true
  });

  wavesurfer.load('https://www.buscasons.com/_arq/2025/buzina-antiga-short-202502141718.mp3');

  wavesurfer.on('loading', (progress) => {
    loadingIndicator.innerHTML = `A carregar o áudio (<b>${progress}%</b>)`;
  });

  wavesurfer.on('ready', () => {
    loadingIndicator.style.display = 'none';
    waveformContainer.style.display = 'block';
    playBtn.disabled = false;

    // Tocar automaticamente ao carregar
    wavesurfer.play();

    // Controla play/pause pelo botão
    playBtn.addEventListener('click', () => {
      wavesurfer.playPause();
    });

    // Muda ícone para "pause" quando toca
    wavesurfer.on('play', () => {
      playIcon.src = 'https://www.buscasons.com/_img/icon_pause_02.png'; // ícone pause
    });

    // Muda ícone para "play" quando pausa
    wavesurfer.on('pause', () => {
      playIcon.src = 'https://www.buscasons.com/_img/icon_play_02.png'; // ícone play
    });
  });

  wavesurfer.on('error', e => console.error('Erro:', e));
</script>
