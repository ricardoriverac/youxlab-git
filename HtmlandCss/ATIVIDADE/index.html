<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biografia</title>
    <link rel="stylesheet" href="css/styles.css">

</head>
<header>
    <h1>Biografia</h1>
</header>

<body>
    <div class="form-container1">
        <img class="Julia" src="img/Eu2.jpeg">
        <h1>Informações sobre mim:</h1>
        <section id="sobre">
            <button>Sobre mim</button>
            
        </section>
        <div class="container-sobre">
            <ol>
                <h3 class="text">Meu nome é Júlia, tenho 16 anos e estou no 2° ano do ensino médio.</h3>
                <br>
                <h2 class="hobbies">HOBBIES</h2>
                <li class="text">Jogar Vôlei</li>
                <br>
                <li class="text">Tocar teclado</li>
                <br>
                <li class="text">Ler livros</li>
                <br>
                <li class="text">Ouvir música</li>
                <br>
                <li class="text">Jogar jogos</li>
                <br>
                <h2>INFORME:</h2>
            </ol>
        </div>
    </div>
    <form id="register-form">
          <div class="name-container">
            <input type="text" name="name" id="name" placeholder="Nome" />
            <input
              type="text"
              name="lastname"
              id="lastname"
              placeholder="Sobrenome"
            />
          </div>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Digite seu e-mail"
          />
          <input type="submit" value="Cadastrar" />
        </form>
    <footer>
        <nav> 
            <a href="/Saiba mais">Saiba mais</a>
        </nav>
    </footer>
    
</body>

</html>
