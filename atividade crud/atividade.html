<body>

    <h1>Tabela pessoas</h1>
    
    <div class="input">
         <label >Nome:</label>
         <input id="inputnome" type="text" name="Nome" id="Nome" placeholder="Digite um nome">
         <label>Telefone:</label>
         <input id="inputtelefone" type="number" name="Telefone" id="Telefone" placeholder="Digite o número de telefone">
         <label>CPF:</label>
         <input id="inputcpf"  type="number" name="CPF" id="CPF" placeholder="Digite o CPF">
         <label>E-mail:</label>
         <input id="inputemail" type="email" name="E-mail" id="E-mail" placeholder="Digite o E-mail">

         <button id="botaoInserir" class="corbotao" >Inserir</button>

    </div>
        <table >
            
            <thead>
                
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>ações</th>

                </tr>
                
            </thead>
            
            <tbody id="corpoTabela">
                
                <tr>
                </tr>
                
            </tbody>
            
    </div>
    </table>
