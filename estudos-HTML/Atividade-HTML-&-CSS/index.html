<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SobreMim</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div id="title-area">
        <hr />
        <div id="conteudo-titulo">
            <div id="minha-foto">
                <img src="img/EuPietro.jpeg" alt="O Próprio">
                <span class="titulo">Site sobre mim</span>
                <span class="titulo>">Pietro Vinícius Borges Marinho</span>
            </div>
        </div>
        <hr />
    </div>
    <div id="info">
        <h1>Habilidades:</h1>
        <ul id="habilidades">
            <li>Sou músico e sei tocar: Saxofone, Bombardino, Tuba e Trombone de pisto;</li>
            <li>Sei um pouco sobre programação;</li>
            <li>Tenho grande conhecimento sobre ecologia;</li>
            <li>Sou bom com lógica</li>
        </ul>
        <h1>Fale Comigo:</h1>
        <form id="register-form">
          <div id="name-container">
            <input type="text" name="name" id="name" placeholder="Nome" />
            <input
              type="text"
              name="lastname"
              id="lastname"
              placeholder="Sobrenome"
            />
          </div>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Digite seu e-mail"
          />
          <input type="submit" value="Cadastrar" />
        </form>
    </div>
</body>
</html>
