    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Meu portfólio</title>
</head>
<body>
  <main>
    <!-- Cabeçario -->
    <header>
      <div class="Minha foto">
      </div>
      <div class="menu">
        <nav class="navegação>
            <a href="#home">Home</a>
            <a href="#projects">Projetos</a>
            <a href="#contact">Contato</a>
        </nav>
      </div>
    </header>  
    
    <!-- HOME -->
    <section id="inicio">
      <div class="informações">
        <h2>Olá, me chamo Pedro Couto</h2>
        <span class="Cargo">YouX Laber</span>
        <span class="Formacoes">
          Cursando YouX lab 02, 
          tenho experiência básica em python
        </span>

        <button>
          <a href="#contact">Contate-me</a>
        </button>
      </div>
      <div class="inicio-img">
        <img src="img/0755875d-f2fb-4489-a119-9f2fca410005.jpeg" alt="Foto de perfil">
      </div>
    </section>

  <!-- CONTATO-->

  <section id="contato">
    <h2>Contato</h2>
    <form>
      <input type="text" placeholder="Digite seu nome" />
      <input type="email" placeholder="Digite seu e-mail" />
      <textarea cols="30" rows="10" placeholder="Digite sua mensagem"></textarea>
      <button>Enviar</button>
    </form>
  </section>

  <footer>
    copyright © 2022 William Lucas. Todos os direitos reservados
  </footer>
  </main>  
</body>
