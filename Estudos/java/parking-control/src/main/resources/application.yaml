spring:
  application:
    name: parking-control
  datasource:
    url: jdbc:postgresql://localhost:5432/parking-control-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

