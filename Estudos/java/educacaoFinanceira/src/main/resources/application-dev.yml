spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/educacaoFinanceira_dev
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      root: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql: TRACE
      com.educacaoFinanceira: DEBUG

  file:
    name: logs/dev.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [DEV] [%level] %logger - %msg%n"