<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu portfólio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bogle&family=Playwrite+DE+SAS:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <img src="img/rickroll-roll.gif" alt="rickroll" id="rickroll">
        <div id="about-container">
            <div id="me">
                <img id="heron" src="img/2025-08-25-134446.jpg" alt="Heron Lopes Alves">
                <h1><- Meu Portfólio</h1>
            </div>
            <p id="full-name">Heron Lopes Alves</p>
        </div>
        <div id="descricao">
            <h3 id="quem-sou-eu">Olá, meu nome é Heron,tenho 17 anos e estou atualmente fazendo parte de um programa de preparação para o mercado de trabalho.</h3>
            <div id="hobbies">
                <h4>Meus hobbies são:</h4>
                <ul>
                    <li>Programar</li>
                    <li>Jogar</li>
                    <li>Ver filmes e/ou séries</li> 
                    <li>Gostar de bicho(não estou falando do jogo)</li>
                </ul>
            </div>
        </div>
        <div id="contate-me" class="fonte-doida">
            <p>Contate-me</p>
            <input type="text" name="nome" id="input-name" placeholder="Nome completo">
            <input type="email" name="e-mail" id="input-e-mail" placeholder="seu e-mail">
        </div>
    </body>
