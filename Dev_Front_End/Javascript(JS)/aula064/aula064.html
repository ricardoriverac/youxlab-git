<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 064 de Javascript</title>
    <link rel="stylesheet" type="text/css" href="./css/styles064.css" />
  </head>
  <body>
    <div id="criarCarro" class="criarCarro">
      <div class="campoForm">
        <label>Nome</label>
        <input
          type="text"
          name="f_nome"
          id="f_nome"
          value=""
          placeholder="Nome do carro"
          disabled
        />
      </div>
      <div class="campoForm">
        <label>Portas</label>
        <input
          type="number"
          name="f_portas"
          id="f_portas"
          value="0"
          placeholder="Quantidade de portas"
          disabled
        />
      </div>
      <div class="campoForm">
        <label>Blindagem</label>
        <input
          type="number"
          name="f_blindagem"
          id="f_blindagem"
          value="0"
          placeholder="Blindagem"
          disabled
        />
      </div>
      <div class="campoForm">
        <label>Munição</label>
        <input
          type="number"
          name="f_municao"
          id="f_municao"
          value="0"
          placeholder="Quantidade de munição"
          disabled
        />
      </div>
      <div class="campoForm">
        <label>Tipo</label>
        <div class="radio">
          <input type="radio" name="f_tipo" id="f_tipoMilitar" value="M" />Militar
        </div>
        <div class="radio">
          <input type="radio" name="f_tipo" id="f_tipoNormal" value="N" />Normal
        </div>
      </div>
      <div class="campoForm">
        <button id="btn_addCarro">Adicionar</button>
      </div>
    </div>
    <div class="carros">
      <!-- <div class="carro">Golf</div> -->
    </div>
    <script src="aula064.js"></script>
  </body>
</html>
