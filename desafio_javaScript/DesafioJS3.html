<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge"> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aulas de Javascript</title>
        <link rel="stylesheet" href="Desafio3JS.css" />
    </head>
    <body>
        <header>
            <h3>TABELA DE PESSOAS</h3>
        </header>
        <div class="campoForm">
            <label>Nome:</label>
            <input class="mainInput" type="text" name="f_nome" id="f_nome" value=""/>
            <label>Telefone:</label>
            <input class="mainInput" type="number" name="f_numero" id="f_numero" value=""/>
            <label>CPF:</label>
            <input class="mainInput" type="number" name="f_cpf" id="f_cpf" value=""/> 
            <label>Email:</label>
            <input class="mainInput" type="email" name="f_email" id="f_email" value=""/>
        <button id="btn_inserir">Inserir</button>
        </div>
        <div>
            <table id="tabela">
                <thead>
                    <tr id="cabecalho-tabela">
                        <th id="tabela1">NOME</th>
                        <th id="tabela2">NUMERO DE TELEFONE</th>
                        <th id="tabela3">CPF</th>   
                        <th id="tabela4">EMAIL</th>
                        <th id="tabela5">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    
                </tbody>
            </table>
         </div>
        </div>
        <div class="res"></div>
    </body>
    <script src="desafioJS3.js"> </script>
</html>
